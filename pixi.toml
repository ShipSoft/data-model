# Pixi workspace for data-model. The default environment builds the library
# standalone and runs its I/O round-trip tests; the lint environment provides
# the prek hook tools (see .pre-commit-config.yaml) reproducibly, including on
# NixOS. Downstream frameworks still build data-model as part of their own
# stacks.
[workspace]
name = "data-model"
description = "SHiP event data model"
channels = ["https://prefix.dev/ship", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.68"

# Lets downstream dev environments (aegir, ...) consume data-model from
# source: `shipdatamodel = { path = "../data-model" }`. Mirrors
# ship-conda-recipes/recipes/shipdatamodel (the release recipe); keep the
# version and the host dependencies in lockstep with it.
[package]
name = "shipdatamodel"
version = "0.4.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.build.config]
extra-args = [
    "-DCMAKE_INSTALL_LIBDIR=lib",
    "-DBUILD_TESTING=OFF",
]

[package.host-dependencies]
# Constrain to a C++23 ROOT build. pixi-build-cmake exact-pins the root_base
# build it resolves here into shipdatamodel's run-export, and its host solve
# does not honour the root_cxx_standard == "==23" below (it can pick a cxx20
# build). An unconstrained root_base therefore leaks a cxx20 run-export that
# conflicts with the C++23 stack (root_cxx_standard == "==23") in downstream
# dev environments (aegir). Pinning the build string keeps the run-export
# cxx23-compatible. Drop once pixi-build honours root_cxx_standard / uses
# root_base's run_exports range.
root_base = { version = "*", build = "cxx23_*" }
root_cxx_standard = "==23"
# Needed at build time: CMakeLists.txt does find_package(mp-units 2.5 CONFIG
# REQUIRED) for the SHiP::SHiPUnits target. Mirrors the release recipe's
# host: (ship-conda-recipes/recipes/shipdatamodel); the workspace
# [dependencies] entry below only covers this repo's own dev env, not the
# pixi-build host environment.
mp-units = ">=2.5"

[dependencies]
cxx-compiler = "*"
cmake = ">=3.21"
ninja = "*"
git = "*"
root = ">=6.40"
root_cxx_standard = "==23"
# Required by the SHiP::SHiPUnits target (find_package(mp-units CONFIG)).
mp-units = ">=2.5"

# Static analysis. clang-tidy lives here rather than in [feature.lint] because
# it replays the commands in compile_commands.json and so needs the same
# headers the compiler saw; feature.lint is a separate solve group and could
# drift from them. clang-tools provides clang-tidy but does not depend on the
# clang package that ships clang's own builtin headers (stddef.h and friends),
# and without those every translation unit fails to parse.
clang = "*"
clang-tools = "*"

[tasks]
# BUILD_TESTING is pinned on: this is the build directory the compat suite
# and scripts/release.sh drive, and passing -D here also resets a cache left
# at OFF by a packaging-style configure.
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON"
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
# Deliberate regeneration of the schema-change gates; run these (and commit
# the results) in the same PR as an intentional schema change. See
# tests/data/README.md.
update-schema-snapshot = { cmd = "build/tests/schema_snapshot --update tests/data/schema_snapshot.txt", depends-on = ["build"] }
update-reference-head = { cmd = "build/tests/write_reference tests/data/reference_head.root", depends-on = ["build"] }

# Static analysis, mirroring ShipSoft/.github's clang-tidy.yml. `clang-tidy`
# reports the whole tree; `clang-tidy-diff` reports only what CI gates on,
# namely findings on lines you changed relative to main. -source-filter is a
# Python regex (run-clang-tidy is a Python script), unlike the llvm::Regex
# patterns in .clang-tidy. These use TOML literal strings so the backslashes
# survive.
clang-tidy = { cmd = '''
run-clang-tidy -p build -j $(nproc) -quiet \
    -source-filter '^(?!.*(/G__|Dict[.]cxx|/_deps/|/CMakeFiles/)).*' \
    -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }
# clang-tidy-diff.py ships with clang-tools but is not on PATH.
clang-tidy-diff = { cmd = '''
git diff --unified=0 --diff-filter=d origin/main HEAD -- '*.cpp' '*.hpp' '*.cxx' '*.h' \
  | python $CONDA_PREFIX/share/clang/clang-tidy-diff.py -p1 -path build -j $(nproc) \
      -quiet -only-check-in-db -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }

[feature.lint.dependencies]
prek = "*"
python = ">=3.11"
clang-format = "23.*"
codespell = "*"
reuse = "*"
cffconvert = "*"
commitizen = "*"

# Pinned via PyPI: conda-forge's gersemi lags the version the other SHiP
# repos standardised on, and reflows CMake differently.
[feature.lint.pypi-dependencies]
gersemi = "==0.29.1"

[feature.lint.tasks]
lint = "prek run --all-files"
# Install the git hooks and route them through `pixi run` so the conda-provided
# hook tools are on PATH at commit time (required on NixOS, where the tools are
# not runnable without pixi activation).
install-hooks = '''
prek install --hook-type pre-commit --hook-type commit-msg
hooks=$(git rev-parse --git-path hooks)
for h in pre-commit commit-msg; do
  sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/$h"
done
'''

[environments]
lint = { features = ["lint"] }
